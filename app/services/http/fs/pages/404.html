<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32H7 CAN Sniffer - Page Not Found</title>
    <style>
        :root {
            --primary-color: #334155;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --accent-color: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            padding: 2rem 0;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 2rem;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
            color: var(--text-primary);
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .logo {
            height: 80px;
            flex-shrink: 0;
        }

        .logo img {
            height: 100%;
            width: auto;
            display: block;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 0;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-link {
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            font-size: 0.9rem;
        }

        .nav-link:hover {
            color: var(--text-primary);
            border-bottom-color: var(--primary-color);
        }

        .nav-link.active {
            color: var(--text-primary);
            border-bottom-color: var(--primary-color);
        }

        /* Error Card */
        .error-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 3rem 1.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .error-code {
            font-size: 4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: inline-block;
            padding: 0.625rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid var(--primary-color);
        }

        .btn-home:hover {
            background-color: #475569;
            border-color: #475569;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 1.5rem 0;
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .logo {
                height: 50px;
                align-self: flex-end;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .nav {
                flex-wrap: wrap;
            }

            .nav-link {
                padding: 0.625rem 1rem;
                font-size: 0.85rem;
            }

            .error-card {
                padding: 2rem 1.25rem;
            }

            .error-code {
                font-size: 3rem;
            }

            .error-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1>STM32H7 CAN Sniffer</h1>
                <div class="subtitle">STM32H743I - Real-time CAN Bus Monitoring & Configuration</div>
            </div>
            <a href="/index.html" class="logo">
                <img src="/files/logo.png" alt="Logo">
            </a>
        </div>

        <!-- Navigation -->
        <nav class="nav">
            <a href="/index.html" class="nav-link">Home</a>
            <a href="/can.shtml" class="nav-link">CAN Setup</a>
            <a href="/can_trace.shtml" class="nav-link">CAN Trace</a>
            <a href="/update.shtml" class="nav-link">Update</a>
        </nav>

        <!-- Error Card -->
        <div class="error-card">
            <div class="error-code">404</div>
            <div class="error-title">Page Not Found</div>
            <div class="error-message">
                The page you're looking for doesn't exist or has been moved.
            </div>
            <a href="/index.html" class="btn-home">Go to Home Page</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /* -------- highlight current page in nav -------- */
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
            const linkPath = new URL(link.href).pathname;
            
            // Direct match
            if (currentPath === linkPath) {
                link.classList.add('active');
            }
            // CGI pages should highlight their related nav item
            else if (linkPath === '/can.shtml' && (currentPath === '/cancontrol.cgi' || currentPath === '/can.cgi')) {
                link.classList.add('active');
            }
        });
        /* ----------------------------------------------- */
    });
    </script>
</body>
</html>
