name: test

on: 
  push: { branches: [ integration, main, ci_cd_pipeline ] }
  pull_request:  { branches: [ main ] }
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Init required submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --depth 1 libs/STM32_HAL/STM32H7
        git -C libs/STM32_HAL/STM32H7 submodule update --init --recursive --depth 1 Drivers/BSP/STM32H7xx_Nucleo
        git -C libs/STM32_HAL/STM32H7 submodule update --init --recursive --depth 1 Drivers/BSP/Components/lan8742
        git -C libs/STM32_HAL/STM32H7 submodule update --init --recursive --depth 1 Drivers/CMSIS/Device/ST/STM32H7xx
        git -C libs/STM32_HAL/STM32H7 submodule update --init --recursive --depth 1 Drivers/BSP/Components/Common

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake gcc make

    - name: Configure with CMake
      run: cmake -S tests -B build

    - name: Build tests
      run: cmake --build build

    - name: Run tests with CTest
      run: ctest --test-dir build --output-on-failure
